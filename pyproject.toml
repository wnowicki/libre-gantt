[project]
name = "libre-gantt"
version = "0.1.0"
description = "Create print-ready PDF and editable Excel Gantt charts from Microsoft Project XML"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "reportlab>=4.2",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
libre-gantt = "libre_gantt.cli:app"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libre_gantt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
