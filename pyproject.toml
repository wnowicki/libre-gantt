[project]
name = "libre-gantt"
version = "0.1.0"
description = "Create print-ready PDF and editable Excel Gantt charts from Microsoft Project XML"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13.4",
    "reportlab>=4.2",
    "typer>=0.12",
    "xlsxwriter>=3.2",
]

[project.scripts]
libre-gantt = "libre_gantt.cli:app"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.0",
    "ruff>=0.16.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/libre_gantt"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]

line-length = 100
extend-exclude = ["*.ipynb"]

[tool.mypy]
python_version = "3.14"
packages = ["src"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["xlsxwriter", "xlsxwriter.*"]
ignore_missing_imports = true
